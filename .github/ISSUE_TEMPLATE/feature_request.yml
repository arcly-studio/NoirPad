name: Feature request
description: An idea that would make NoirPad better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could NoirPad help?
  - type: markdown
    attributes:
      value: NoirPad stays local-first — no accounts, no cloud, no telemetry. Ideas that need a server we run are out of scope.
